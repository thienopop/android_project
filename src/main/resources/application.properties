server.address=localhost
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/android
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tự động tạo hoặc cập nhật bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

file.allowed-extensions=jpg,jpeg,png,gif,bmp,webp,svg,tiff,heic,heif,\
mp3,wav,ogg,m4a,flac,aac,wma,mid,midi,\
mp4,avi,mov,mkv,wmv,webm,flv,mpeg,mpg,3gp,m4v,\
pdf,doc,docx,xls,xlsx,ppt,pptx,txt,csv,odt,ods,rtf
file.upload-dir=uploads
file.access-url=http://${server.address}:${server.port}/${file.upload-dir}

# True: Tạo dữ liệu mẫu khi khởi động ứng dụng (Xem com.example.demo.config.seeder.Seeder). False: Không tạo dữ liệu mẫu.
app.seed-data=false
